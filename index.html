html{scroll-padding-top:96px}

button{cursor:pointer}

.lang{background:none;border:0;color:#fff;font-size:12px;padding:8px 4px}

.tripbtn{background:none;border:0;font-size:19px;font-weight:600;letter-spacing:.231px;line-height:1.19;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0;text-align:left}
.seg{display:flex;background:var(--hair);border-radius:9999px;padding:2px;flex:none}

.pill.s{padding:7px 16px;font-size:14px;letter-spacing:-.224px;white-space:nowrap}
.pill.g{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.pill:active,.opt:active,.mcard:active{transform:scale(.95)}
.tl{background:none;border:0;color:var(--primary);padding:8px 8px;font-size:17px}
.tl.d{color:var(--sky)}
.tile{padding:80px 22px;text-align:center}

.opt{background:var(--white);border:1px solid var(--hair);border-radius:9999px;padding:10px 18px;transition:transform .12s}

textarea{width:100%;border:1px solid rgba(0,0,0,.08);outline:1px solid var(--hair);border-radius:18px;padding:12px 20px;background:var(--white);resize:vertical}
.x{background:none;border:0;color:var(--ink48);font-size:16px;padding:8px}
.flow .pill.f{display:block;width:100%;margin-top:24px;font-size:17px;padding:14px}
.back{margin-bottom:10px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:40px;text-align:left}
.mcard{background:var(--white);border:1px solid var(--hair);border-radius:18px;overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column;transition:transform .12s}

.pin{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--primary);border:3px solid #fff;transform:translate(-50%,-50%)}
footer{background:var(--parch);padding:32px 22px calc(32px + env(safe-area-inset-bottom,0px));text-align:center}

</style>
</head>

fr.onload=function(){var im=new Image();
im.onload=function(){res(draw(im,im.width,im.height))};
im.onerror=function(){if(!window.createImageBitmap)return res('');createImageBitmap(f).then(function(bm){res(draw(bm,bm.width,bm.height))}).catch(function(){res('')})};

v.innerHTML='<section class="tile l"><div class="in"><p class="tag">'+t('total')+'</p><h1 class="hero" style="margin-top:8px">'+w(tot)+'</h1><p class="cap" style="margin-top:8px;font-size:17px">≈ '+jy(tot)+'</p><p class="lead">'+t('tl')+'</p><div class="ctas"><button class="pill" data-a="addx">'+t('addX')+'</button><button class="pill g" data-a="memnew">'+t('addM')+'</button></div></div></section>'

+fxTile()
+'<section class="tile p"><div class="in"><h2 class="disp">'+t('by')+'</h2><div class="grid">'+cards+'</div></div></section>'
+'<section class="tile l"><div class="in"><h2 class="disp">'+t('recent')+'</h2><p class="cap" style="margin-top:6px">'+tr.tx.length+t('tn')+'</p><div class="list">'+list+'</div></div></section>'
+'<footer><p class="fine" style="margin-bottom:6px">'+t('saveNote')+'</p><button class="tl" data-a="intro">'+t('about')+'</button></footer>'}
function payOpts(cur_){return '<div class="opts" style="margin-top:6px">'+['cash','wow','card'].map(function(m){return '<button class="opt'+(cur_==m?' sel':'')+'" data-a="m" data-m="'+m+'">'+t(m)+'</button>'}).join('')+'</div>'}
function expForm(){var tr=cur();
v.innerHTML='<section class="tile l"><div class="flow"><button class="tl back" data-a="'+(E.mem?'mview':'tabh')+'" data-id="'+E.mem+'">'+t('back')+'</button><h1 class="disp">'+t('xT')+'</h1>'
+'<label>'+t('date')+'</label><input type="date" data-d="E" data-f="date" value="'+E.date+'"><label>'+t('what')+'</label><input data-d="E" data-f="store" value="'+esc(E.store)+'" placeholder="'+t('whatPh')+'"><label>'+t('cat')+'</label><select data-d="E" data-f="cat">'+t('cats').map(function(c,i){return '<option value="'+i+'"'+(i==E.cat?' selected':'')+'>'+c+'</option>'}).join('')+'</select><label>'+t('amount')+'</label><input type="number" inputmode="numeric" data-d="E" data-f="amount" value="'+(E.amount||'')+'" placeholder="0"><label>'+t('pay')+'</label>'+payOpts(E.m)
+(tr.mem.length?'<label>'+t('link')+'</label><select data-d="E" data-f="mem"><option value="">'+t('none')+'</option>'+tr.mem.map(function(m){return '<option value="'+m.id+'"'+(m.id==E.mem?' selected':'')+'>'+esc(m.title||locOf(m)||m.date)+' ('+m.date+')</option>'}).join('')+'</select>':'')
+(E.err?'<p class="cap" style="margin:14px 14px 0">'+t('needA')+'</p>':'')+'<button class="pill f" data-a="xsave">'+t('save')+'</button></div></section>'}
function mem(){var tr=cur(),list=tr.mem.slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:b.id-a.id)});
var cards=list.map(function(m){var sp=tsum(tr,function(x){return x.mem==m.id});return '<button class="mcard" data-a="mview" data-id="'+m.id+'">'+(m.thumb?'<img src="'+m.thumb+'" alt="">':'<div class="ph"></div>')+'<div class="mb"><b>'+esc(m.title||locOf(m)||m.date)+'</b><span class="cap">'+m.date+(locOf(m)?' · '+esc(locShort(m)):'')+'</span>'+(sp?'<span class="cap" style="color:var(--ink)">'+w(sp)+' · ≈ '+jy(sp)+'</span>':'')+'</div></button>'}).join('');
v.innerHTML='<section class="tile l"><div class="in"><h1 class="hero">'+t('tabM')+'</h1><p class="lead">'+t('memL')+'</p><div class="ctas"><button class="pill" data-a="memnew">'+t('addM')+'</button></div><div class="mgrid">'+(cards||'<p class="cap" style="grid-column:1/-1;text-align:center">'+t('emptyM')+'</p>')+'</div></div></section><footer><p class="fine">'+t('saveNote')+'</p></footer>'}
function memNew(){
v.innerHTML='<section class="tile l"><div class="flow"><button class="tl back" data-a="tabm">'+t('back')+'</button><h1 class="disp">'+t('memNewT')+'</h1>'
+'<div class="surf">'+(M.photo?'<img src="'+M.photo+'" alt="">':'<span class="cap">'+t('photoNone')+'</span>')+'</div><input type="file" id="pf" accept="image/*" hidden><label class="pill g f" for="pf" style="cursor:pointer;margin-top:14px;color:var(--primary);font-size:17px;letter-spacing:-.374px">'+(M.photo?t('photoChg'):t('photoPick'))+'</label><p class="cap" id="pst" style="text-align:center;margin-top:8px"></p>'
+'<label>'+t('title')+'</label><input data-d="M" data-f="title" value="'+esc(M.title)+'" placeholder="'+t('titlePh')+'"><label>'+t('date')+'</label><input type="date" data-d="M" data-f="date" value="'+M.date+'"><label>'+t('note')+'</label><textarea rows="3" data-d="M" data-f="note">'+esc(M.note)+'</textarea>'
+locUI()+'<input style="margin-top:12px" data-d="M" data-f="place" value="'+esc(M.place)+'" placeholder="'+t('placePh')+'">'
+'<label>'+t('spend')+'</label><input type="number" inputmode="numeric" data-d="M" data-f="amount" value="'+(M.amount||'')+'" placeholder="₩ 0">'+payOpts(M.m)+'<input style="margin-top:12px" data-d="M" data-f="what" value="'+esc(M.what)+'" placeholder="'+t('what')+'"><p class="cap" style="margin:8px 14px 0">'+t('spendH')+'</p>'
+(M.err?'<p class="cap" style="margin:14px 14px 0">'+t('needM')+'</p>':'')+'<button class="pill f" data-a="msave">'+t('save')+'</button></div></section>';
document.getElementById('pf').onchange=function(e){var f=e.target.files[0];if(!f)return;var ps=document.getElementById('pst');if(ps)ps.textContent=t('photoBusy');imgScale(f,1280,.8).then(function(big){if(!big){var p2=document.getElementById('pst');if(p2)p2.textContent=t('photoErr');return}return imgScale(f,360,.7).then(function(th){M.photo=big;M.thumb=th||big;render()})})};}
function memView(){var tr=cur(),m=tr.mem.filter(function(x){return x.id==VM})[0];if(!m){scr='mem';return mem()}
var ex=tr.tx.filter(function(x){return x.mem==m.id}),sp=ex.reduce(function(a,x){return a+x.total},0);
v.innerHTML='<section class="tile l"><div class="flow"><button class="tl back" data-a="tabm">'+t('back')+'</button>'+(m.thumb?'<img class="mphoto" id="mp" src="'+m.thumb+'" alt="">':'')
+'<h1 class="disp" style="margin-top:22px">'+esc(m.title||locOf(m)||m.date)+'</h1><p class="cap" style="text-align:center;margin-top:4px">'+m.date+(locOf(m)?' · '+esc(locOf(m)):'')+'</p>'+(m.note?'<p style="margin-top:16px;white-space:pre-wrap">'+esc(m.note)+'</p>':'')
+mapLink(m)
+'<div class="card" style="margin-top:28px"><b>'+t('spent')+'</b><span class="v">'+w(sp)+'</span><span class="cap">≈ '+jy(sp)+'</span>'+(ex.length?ex.map(function(x){return '<div class="li"><span>'+esc(x.store)+'<small>'+t('cats')[x.cat]+' · '+t(x.m)+'</small></span><span style="display:flex;align-items:center;gap:2px"><b>'+w(x.total)+'</b><button class="x" data-a="xdel" data-id="'+x.id+'" aria-label="delete">✕</button></span></div>'}).join(''):'<p class="cap" style="margin-top:8px">'+t('noSpend')+'</p>')+'</div>'
+'<button class="pill f" data-a="addxm">'+t('addX')+'</button><div style="text-align:center;margin-top:16px"><button class="tl" style="color:var(--ink48)" data-a="mdel">'+t('delM')+'</button></div></div></section>';
dbGet('p'+m.id).then(function(u){var el=document.getElementById('mp');if(u&&el)el.src=u})}
/* ---- イベント ---- */
document.addEventListener('input',function(e){var id=e.target.id,o;if(id=='cj'){o=document.getElementById('ck');o.value=e.target.value?Math.round(e.target.value*R.r):''}else if(id=='ck'){o=document.getElementById('cj');o.value=e.target.value?Math.round(e.target.value/R.r):''}});
document.addEventListener('change',function(e){var f=e.target.dataset&&e.target.dataset.f;if(!f||scr!='memnew')return;sync();if(f=='siK'){M.gu='';M.guT='';M.dong='';M.dongT=''}else if(f=='gu'){M.dong='';M.dongT=''}else if(f!='dong')return;var y=window.scrollY;render(true);window.scrollTo(0,y)});
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
sync();if(scr=='new')readNT();
if(a=='intro'){scr='intro'}
else if(a=='cont'||a=='tabh'){scr='home'}
else if(a=='tabm'){scr='mem'}
else if(a=='start'){NT={regions:[],custom:'',budget:300000,err:false};scr='new'}
else if(a=='tr'){var k=b.dataset.k,ix=NT.regions.indexOf(k);if(ix>-1)NT.regions.splice(ix,1);else NT.regions.push(k);NT.err=false}
else if(a=='mk'){if(!NT.regions.length&&!NT.custom.trim()){NT.err=true}else{var id=Date.now();S.trips.push({id:id,regions:NT.regions.slice(),custom:NT.custom.trim(),budget:NT.budget>0?NT.budget:300000,tx:[],mem:[]});S.cur=id;sv();scr='home'}}
else if(a=='trips'){scr='trips'}
else if(a=='pick'){S.cur=+b.dataset.id;sv();scr='home'}
else if(a=='tdel'){var did=+b.dataset.id;if(!confirm(t('delq')))return;S.trips.filter(function(x){return x.id==did}).forEach(function(x){x.mem.forEach(function(m){dbDel('p'+m.id)})});S.trips=S.trips.filter(function(x){return x.id!=did});if(S.cur==did)S.cur=S.trips.length?S.trips[0].id:null;sv();if(!S.trips.length)scr='intro'}
else if(a=='addx'){E=newE();scr='exp'}
else if(a=='addxm'){E=newE(String(VM));scr='exp'}
else if(a=='m'){(scr=='exp'?E:M).m=b.dataset.m}
else if(a=='xsave'){if(!(+E.amount>0)){E.err=true}else{cur().tx.push({id:Date.now(),date:E.date||TODAY,store:(E.store||'').trim()||t('cats')[+E.cat],cat:+E.cat,total:Math.round(+E.amount),m:E.m,mem:E.mem?+E.mem:null});sv();if(E.mem){VM=+E.mem;scr='memview'}else scr='home'}}
else if(a=='xdel'){var xid=+b.dataset.id;var tr0=cur();tr0.tx=tr0.tx.filter(function(x){return x.id!=xid});sv()}
else if(a=='memnew'){M=newM();var t1=cur();M.siK=t1.regions[0]||(t1.custom?'__o':'');M.siT=t1.regions[0]?'':(t1.custom||'');scr='memnew'}
else if(a=='msave'){if(!M.photo&&!(M.title||'').trim()){M.err=true}else{var mid=Date.now(),tr=cur(),LF=locFin();tr.mem.push({id:mid,date:M.date||TODAY,title:(M.title||'').trim(),note:(M.note||'').trim(),siK:LF.siK,si:LF.si,gu:LF.gu,dong:LF.dong,place:(M.place||'').trim(),thumb:M.thumb});if(M.photo)dbPut('p'+mid,M.photo);if(+M.amount>0)tr.tx.push({id:mid+1,date:M.date||TODAY,store:(M.what||'').trim()||(M.title||'').trim()||t('cats')[4],cat:4,total:Math.round(+M.amount),m:M.m,mem:mid});sv();VM=mid;scr='memview'}}
else if(a=='mview'){VM=+b.dataset.id;scr='memview'}
else if(a=='mdel'){if(!confirm(t('delMq')))return;var t2=cur();t2.mem=t2.mem.filter(function(x){return x.id!=VM});t2.tx.forEach(function(x){if(x.mem==VM)x.mem=null});dbDel('p'+VM);sv();scr='mem'}
else if(a=='bud'){var n=prompt(t('budq'),cur().budget);if(n&&+n>0){cur().budget=+n;sv()}}
else if(a=='fx'){fetchRate();return}
else if(a=='fxset'){var n2=prompt(t('fxq'),(R.r*100).toFixed(1));if(n2&&+n2>0){R={r:+n2/100,live:false,at:Date.now(),src:'manual',busy:false};saveR()}}
else return;
var y0=window.scrollY;render();if(a=='tr'||a=='m')window.scrollTo(0,y0)});
document.getElementById('lang').onclick=function(){readNT();L=L=='ja'?'ko':'ja';render()};
render();fetchRate();
</script>
